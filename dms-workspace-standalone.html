<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>DMS Transport Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
/* ===== DMS Transport Workspace — Design System ===== */
:root{
  --ink:#1B2430; --ink-soft:#4A5468; --muted:#7C8598; --faint:#A7AEBD;
  --paper:#F2F5FB; --surface:#FFFFFF; --surface-2:#F7F9FD;
  --line:#DCE3F0; --line-soft:#EBF0F9;
  --teal:#1E4E9C; --teal-dark:#153A75; --teal-tint:#E7EEFA;
  --ochre:#C97D2A; --ochre-tint:#FBEDDD;
  --success:#1F8A5F; --success-tint:#E4F5EC;
  --warning:#B8791F; --warning-tint:#FCF1DE;
  --danger:#C6414B; --danger-tint:#FBE7E8;
  --info:#2E6E8E; --info-tint:#E7F1F5;
  --nav:#0F2544; --nav-2:#173463; --nav-line:rgba(255,255,255,.08);
  --radius-sm:8px; --radius:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(20,25,20,.06);
  --shadow:0 6px 20px rgba(20,30,25,.08);
  --shadow-lg:0 20px 60px rgba(15,25,20,.18);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#EEF3FC;-webkit-font-smoothing:antialiased;position:relative}
.bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-blobs::before,.bg-blobs::after{content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.bg-blobs::before{width:520px;height:520px;top:-160px;left:-120px;background:radial-gradient(circle,var(--teal) 0%,transparent 70%);animation:blobDrift1 22s ease-in-out infinite}
.bg-blobs::after{width:460px;height:460px;bottom:-140px;right:-100px;background:radial-gradient(circle,#5B9BD5 0%,transparent 70%);animation:blobDrift2 26s ease-in-out infinite}
@keyframes blobDrift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}}
@keyframes blobDrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.08)}}
@media (prefers-reduced-motion: reduce){.bg-blobs::before,.bg-blobs::after{animation:none}}
h1,h2,h3,.brand,.nav-item,.btn,.metric-value{font-family:'Manrope',Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--teal);color:#fff}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.mono{font-family:'JetBrains Mono','SF Mono',Consolas,monospace;font-variant-numeric:tabular-nums}

/* ===== Layout ===== */
.app-shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--nav),var(--nav-2));color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2C5FAE,var(--teal));display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;box-shadow:0 4px 14px rgba(30,78,156,.45)}
.brand-logo{object-fit:cover;background:#fff;padding:0;border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.nav-section{font-size:11px;letter-spacing:.06em;color:#8CA39B;padding:14px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:2px 0;border-radius:9px;color:#D7E4DF;cursor:pointer;font-weight:500;font-size:14px;transition:background .15s var(--ease),color .15s var(--ease),transform .1s var(--ease);position:relative}
.nav-item svg,.nav-item .ic{width:17px;flex:0 0 auto;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
.nav-item.active{background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(15,109,102,.35)}
.nav-item.active .ic{opacity:1}

.main{min-width:0}
.topbar{height:68px;background:rgba(246,245,241,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.top-actions{display:flex;gap:10px;align-items:center}
.user-chip{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;max-width:250px}
.user-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--teal-tint);display:grid;place-items:center;font-weight:700;color:var(--teal);flex:0 0 auto;font-size:13px}
.content{padding:28px 30px 48px;max-width:1400px}
.page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.page-title h1{font-size:25px;margin:0 0 5px;font-weight:800;letter-spacing:-.015em}
.page-title p{margin:0;color:var(--muted);font-size:14px}

/* ===== Buttons ===== */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 15px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink);transition:all .15s var(--ease);display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,109,102,.12)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.primary:hover{background:var(--teal-dark);color:#fff;box-shadow:0 6px 18px rgba(15,109,102,.35)}
.btn.danger{color:var(--danger);border-color:var(--danger-tint)}
.btn.danger:hover{background:var(--danger-tint);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none}
.btn.full{width:100%;justify-content:center}
.btn.small{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.editing{background:var(--ochre);border-color:var(--ochre);color:#fff}
.btn.editing:hover{background:#b06e22;color:#fff}

/* ===== Cards / metrics ===== */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;transition:box-shadow .25s var(--ease),transform .25s var(--ease),background .25s var(--ease);position:relative;overflow:hidden}
.card:hover{box-shadow:0 10px 30px rgba(30,78,156,.22),0 0 0 1px rgba(30,78,156,.15);transform:translateY(-3px);background:linear-gradient(160deg,#fff 60%,var(--teal-tint))}
.card.c-amber:hover{box-shadow:0 10px 30px rgba(201,125,42,.22),0 0 0 1px rgba(201,125,42,.15);background:linear-gradient(160deg,#fff 60%,var(--ochre-tint))}
.card.c-red:hover{box-shadow:0 10px 30px rgba(198,65,75,.22),0 0 0 1px rgba(198,65,75,.15);background:linear-gradient(160deg,#fff 60%,var(--danger-tint))}
.card.c-blue:hover{box-shadow:0 10px 30px rgba(46,110,142,.22),0 0 0 1px rgba(46,110,142,.15);background:linear-gradient(160deg,#fff 60%,var(--info-tint))}
.card.c-amber{border-left-color:var(--ochre)}
.card.c-red{border-left-color:var(--danger)}
.card.c-blue{border-left-color:var(--info)}
.metric-label{color:var(--muted);font-size:12.5px;font-weight:600}
.metric-value{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.metric-sub{font-size:12px;margin-top:6px;color:var(--faint)}

.grid-2{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface-2)}
.panel-head h3{margin:0;font-size:15px;font-weight:700}
.panel-body{padding:18px 20px}

/* ===== Tables ===== */
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;padding:10px 10px;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em;border-bottom:1px solid var(--line);white-space:normal;position:sticky;top:0;line-height:1.3}
.table td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.table tbody tr{transition:background .15s var(--ease),box-shadow .15s var(--ease);border-left:3px solid transparent}
.table tbody tr:hover{background:var(--teal-tint);border-left-color:var(--teal);box-shadow:inset 0 0 0 1px rgba(30,78,156,.18)}
.table tbody tr.clickable-check:hover{background:#DCEAFB;border-left-color:var(--teal-dark);cursor:pointer}
.table tbody tr.row-pending{border-left-color:var(--warning)}
.table tbody tr.row-completed{border-left-color:var(--success)}
.table tbody tr.row-cancelled{border-left-color:var(--danger)}
.table tbody tr.row-review{border-left-color:var(--ochre)}

.badge{display:inline-flex;align-items:center;border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;color:#fff}
.pending{background:#FDAB3D}
.booked{background:#0086C0}
.sent-to-driver,.pre-start{background:#A25DDC}
.completed,.active,.post-shift{background:#00C875}
.cancelled,.open{background:#E2445C}
.in-review,.needs-review{background:#FFCB00;color:#4B3B00}

.status-select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);min-width:130px;cursor:pointer;transition:border-color .15s}
.status-select:hover{border-color:var(--teal)}

/* Editable table cells */
.editing-mode .table td{position:relative}
.table td input,.table td select{width:100%;min-width:56px;border:1px solid transparent;border-radius:6px;padding:6px 7px;background:transparent;font-size:12.5px;transition:all .15s var(--ease)}
.editing-mode .table td input,.editing-mode .table td select{border-color:var(--line);background:var(--surface)}
.editing-mode .table td input:hover,.editing-mode .table td select:hover{border-color:var(--ochre)}
.editing-mode .table td input:focus,.editing-mode .table td select:focus{
  border-color:var(--teal); outline:none; box-shadow:0 0 0 3px var(--teal-tint);
}
.table td input.popped-field,.table td select.popped-field{
  position:fixed !important; z-index:500; min-width:220px; max-width:380px; width:auto;
  background:#fff; border-color:var(--teal) !important; outline:none;
  box-shadow:0 16px 40px rgba(20,30,50,.32),0 0 0 3px var(--teal-tint);
  padding:10px 13px; font-size:14px; border-radius:8px;
}
.table td input:disabled,.table td select:disabled{color:var(--ink);cursor:default;-webkit-text-fill-color:var(--ink)}
.cell-saved{animation:cellFlash .9s var(--ease)}
@keyframes cellFlash{0%{background:var(--success-tint)}100%{background:transparent}}

.group-row td{background:var(--surface-2);font-size:11.5px;color:var(--muted);padding:9px 13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}

.col-actions{display:flex;gap:6px}
.col-add-btn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;transition:all .15s}
.col-add-btn:hover{border-color:var(--teal);color:var(--teal);border-style:solid}
th.col-removable{position:relative}
.col-del-x{position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:10px;line-height:15px;text-align:center;cursor:pointer;opacity:0;transition:opacity .15s}
th.col-removable:hover .col-del-x{opacity:1}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:13px;transition:border-color .15s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--teal);outline:none}

.connection{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;transition:box-shadow .15s}
.connection:hover{box-shadow:var(--shadow-sm)}
.ok{color:var(--success);font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px}
.ok::before{content:'●';font-size:9px}
.warn{color:var(--warning);font-weight:700;font-size:12px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.empty{padding:32px;text-align:center;color:var(--muted)}
.loading-bar,.error-banner{margin-bottom:14px;border-radius:9px;padding:11px 14px;font-size:13px;font-weight:500}
.loading-bar{background:var(--teal-tint);color:var(--teal-dark)}
.error-banner{background:var(--danger-tint);color:var(--danger);border:1px solid #F3C6CA}

/* ===== Auth (legacy, unused but kept safe) ===== */
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,var(--teal-tint) 0,transparent 40%),var(--paper)}
.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:30px;box-shadow:var(--shadow-lg)}
.auth-brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}
.auth-brand div:last-child{display:flex;flex-direction:column;gap:2px}
.auth-brand small{color:var(--muted)}
.auth-card h1{margin:0 0 8px;font-size:27px;font-weight:800}
.auth-card>p{color:var(--muted);margin:0 0 22px}
.auth-form{display:grid;gap:15px}
.auth-form label,.form-grid label{display:grid;gap:7px;font-size:13px;font-weight:700}
.auth-form input,.form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);outline:none;transition:border-color .15s}
.auth-form input:focus,.form-grid input:focus,.form-grid select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
.text-btn{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:14px 0 0}
.auth-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.auth-message{margin:0 0 15px;padding:10px 12px;border-radius:9px;background:var(--teal-tint);color:var(--teal-dark);font-size:13px}

/* ===== Modal ===== */
.modal-backdrop,.compliance-modal-backdrop{position:fixed;inset:0;background:rgba(15,20,20,.55);backdrop-filter:blur(2px);z-index:50;display:grid;place-items:center;padding:18px;animation:fadeIn .18s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal,.compliance-modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);animation:modalIn .22s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head,.compliance-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.modal-head h3,.compliance-head h3{margin:0;font-weight:800;font-size:16px}
.icon-btn,.compliance-head button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px;transition:all .15s}
.icon-btn:hover,.compliance-head button:hover{background:var(--danger-tint);color:var(--danger)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}
.span-2{grid-column:span 2}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding-top:4px}
.compliance-body{padding:20px 22px}
.answers-title{font-weight:800;font-size:13px;margin:14px 0 10px;color:var(--ink-soft)}
.answer-row{display:grid;grid-template-columns:190px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.answer-label{color:var(--muted);font-weight:600}
.answer-value{word-break:break-word}
.issue-summary{background:var(--danger-tint);color:var(--danger);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
.pass-summary{background:var(--success-tint);color:var(--success);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:13px}

/* ===== Show-more ===== */
.show-more-row td{text-align:center;padding:12px}
.link-btn{border:0;background:none;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;padding:6px 10px;border-radius:7px;transition:background .15s}
.link-btn:hover{background:var(--teal-tint)}

/* ===== Payload thumbnails / file chips ===== */
.payload-thumb{max-width:220px;max-height:160px;border-radius:8px;border:1px solid var(--line);object-fit:cover;display:block;box-shadow:var(--shadow-sm);transition:transform .15s var(--ease)}
.payload-thumb:hover{transform:scale(1.03)}
.payload-thumb-sm{max-width:70px;max-height:50px}
.file-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px 6px 8px;font-size:12.5px;font-weight:600;color:var(--teal);text-decoration:none;transition:all .15s var(--ease)}
.file-chip:hover{border-color:var(--teal);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.file-chip-ic{background:var(--teal);color:#fff;border-radius:5px;padding:2px 6px;font-size:9.5px;font-weight:800;letter-spacing:.02em}
.muted{color:var(--faint)}

/* ===== Fleet group headers (Monday-style solid color bars) ===== */
.group-row td{border-top:none;padding-top:10px;padding-bottom:10px;text-align:left}
.group-row{position:sticky;top:38px}
.group-title{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em}
.group-ic{width:18px;height:18px;color:#fff}
.group-ic svg{width:100%;height:100%}
.group-count{opacity:.85;font-weight:600}

/* Fleet: tighter column widths so more fits without horizontal scroll */
.fleet-table{font-size:12.5px}
.fleet-table th,.fleet-table td{padding:7px 8px}
.fleet-table th:nth-child(5),.fleet-table td:nth-child(5){width:56px}
.fleet-table th:nth-child(9),.fleet-table td:nth-child(9){width:80px}
.fleet-table th:nth-child(11),.fleet-table td:nth-child(11),
.fleet-table th:nth-child(12),.fleet-table td:nth-child(12),
.fleet-table th:nth-child(13),.fleet-table td:nth-child(13){width:70px}
.fleet-table th:nth-child(14),.fleet-table td:nth-child(14){width:80px}
.fleet-table td input,.fleet-table td select{font-size:12px;padding:5px 6px}

/* ===== File upload cell ===== */
.file-upload-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.file-upload-input{display:none}
.file-upload-btn{cursor:pointer}
.file-chip-broken{color:var(--muted);background:var(--surface-2);cursor:default}
.pdf-fail-note{opacity:.75;font-weight:500;font-size:11px}
.pdf-thumb-wrap{display:inline-block}
.pdf-canvas-link{display:block;width:fit-content}
.pdf-canvas-link[hidden]{display:none}
.pdf-thumb-canvas{max-width:130px;border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow-sm);display:block;transition:transform .15s var(--ease)}
.pdf-canvas-link:hover .pdf-thumb-canvas{transform:scale(1.04);box-shadow:var(--shadow)}

.system-status-section{margin-top:32px;padding-top:22px;border-top:1px dashed var(--line)}
.system-status-section .section-label{font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:700;margin-bottom:10px;text-transform:uppercase}

@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.app-shell{grid-template-columns:214px 1fr}}
@media(max-width:760px){.app-shell{display:block}.sidebar{position:relative;height:auto}.topbar{position:relative;padding:10px 16px;height:auto;align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.user-chip span{display:none}.content{padding:18px 14px}.cards{grid-template-columns:1fr 1fr}.page-title{flex-direction:column}.table{min-width:820px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:span 1}}
@media(max-width:480px){.cards{grid-template-columns:1fr}}

/* ===== Loading splash (first load only) ===== */
.splash-screen{position:fixed;inset:0;background:rgba(246,247,251,.97);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:1000;animation:splashFadeIn .3s var(--ease)}
@keyframes splashFadeIn{from{opacity:0}to{opacity:1}}
.splash-ring-wrap{position:relative;width:96px;height:96px;display:grid;place-items:center}
.splash-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg, transparent 0%, var(--teal) 70%, transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 6px));animation:splashSpin 1.1s linear infinite}
@keyframes splashSpin{to{transform:rotate(360deg)}}
.splash-logo{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 4px 16px rgba(20,30,50,.18);animation:splashPulse 1.6s ease-in-out infinite}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.splash-text{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}

/* ===== Dashboard card signature icon animations =====
   Auto-plays once on refresh (.auto-play), and replays on hover any time after. */
.card-anim-ic{position:absolute;top:14px;right:16px;width:34px;height:34px;opacity:.92;pointer-events:none;color:var(--teal)}
.card.c-blue .card-anim-ic{color:var(--info)}
.card.c-red .card-anim-ic{color:var(--danger)}
.card.c-amber .card-anim-ic{color:var(--ochre)}

/* Bell (incidents) */
.anim-bell{display:block;width:100%;height:100%;transform-origin:50% 10%}
.card-anim-ic.auto-play .anim-bell{animation:bellRing 1s ease-in-out 2}
.card:hover .anim-bell{animation:bellRing 1s ease-in-out 2}
@keyframes bellRing{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-15deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}

/* Key fob (fleet) */
.anim-keyfob{display:block;width:100%;height:100%;position:relative}
.anim-wave{position:absolute;inset:-6px;border:2px solid currentColor;border-radius:50%;opacity:0}
.card-anim-ic.auto-play .anim-wave,.card:hover .anim-wave{animation:kfWave 1.4s ease-out 2}
.card-anim-ic.auto-play .kf-btn,.card:hover .kf-btn{animation:kfPress 1.4s ease-in-out 2}
@keyframes kfWave{0%{transform:scale(.4);opacity:.9}70%{opacity:0}100%{transform:scale(1.5);opacity:0}}
@keyframes kfPress{0%,100%{opacity:1}20%{opacity:.3}25%{opacity:1}}

/* Phone booking */
.anim-phone{display:block;width:100%;height:100%}
.anim-badge{position:absolute;bottom:-2px;right:-4px;width:16px;height:16px;background:var(--success);border-radius:50%;color:#fff;padding:3px;box-sizing:border-box;transform:scale(1);box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.card-anim-ic.auto-play .anim-badge,.card:hover .anim-badge{animation:badgePop .9s cubic-bezier(.34,1.56,.64,1) 1 .3s forwards}
@keyframes badgePop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0)}}

/* Double check */
.anim-tick{position:absolute;top:0;width:100%;height:100%;opacity:1}
.anim-tick1{left:-6px}
.anim-tick2{left:6px}
.card-anim-ic.auto-play .anim-tick1,.card:hover .anim-tick1{animation:tickIn .5s ease-out 1 forwards}
.card-anim-ic.auto-play .anim-tick2,.card:hover .anim-tick2{animation:tickIn .5s ease-out 1 .22s forwards}
@keyframes tickIn{0%{opacity:0;transform:translateX(-8px) scale(.6)}100%{opacity:1;transform:translateX(0) scale(1)}}

/* ===================== Generic editable-table system ===================== */

function editToggle(pageKey){
  const on = !!editState[pageKey];
  return `<button class="btn ${on?'editing':''}" data-edit-toggle="${pageKey}">${on?'✓ Done':'✎ Edit'}</button>`;
}

// cell renderers — all carry data-e* attributes read by the single generic handler
function eText(table,stateKey,id,key,value,{type='text',cast='',disabled=false}={}){
  return `<input data-etable="${table}" data-estate="${stateKey}" data-eid="${id}" data-ekey="${key}" data-ecast="${cast}" type="${type}" value="${esc(value??'')}" ${disabled?'disabled':''}>`;
}
function eSelect(table,stateKey,id,key,value,opts,{cast='',disabled=false,blank=true}={}){
  return `<select data-etable="${table}" data-estate="${stateKey}" data-eid="${id}" data-ekey="${key}" data-ecast="${cast}" ${disabled?'disabled':''}>${blank?'<option value=""></option>':''}${opts.map(o=>{
    const val = typeof o==='object'?o.value:o; const lab = typeof o==='object'?o.label:o;
    return `<option value="${esc(val)}" ${String(value??'')===String(val)?'selected':''}>${esc(lab)}</option>`;
  }).join('')}</select>`;
}
function eStaffSelect(table,stateKey,id,key,value,{disabled=false}={}){
  return eSelect(table,stateKey,id,key,value,state.staff.map(s=>({value:s.id,label:s.name})),{disabled,blank:true}).replace('<option value=""></option>','<option value="">Unassigned</option>');
}
function eExtra(table,stateKey,id,extraKey,value,{disabled=false}={}){
  return `<input data-etable="${table}" data-estate="${stateKey}" data-eid="${id}" data-eextra="${extraKey}" value="${esc(value??'')}" ${disabled?'disabled':''}>`;
}
function extraKeysOf(arr){const keys=new Set();arr.forEach(r=>Object.keys(r.extra||{}).forEach(k=>keys.add(k)));return [...keys];}

async function genericFieldChange(el){
  const table = el.dataset.etable, stateKey = el.dataset.estate, id = el.dataset.eid, cast = el.dataset.ecast, extraKey = el.dataset.eextra;
  const td = el.closest('td');
  let patch;
  if(extraKey){
    const row = state[stateKey]?.find(r=>r.id===id);
    const extra = {...(row?.extra||{}), [extraKey]: el.value};
    patch = {extra};
  } else {
    const key = el.dataset.ekey;
    let value = el.value;
    if(cast==='number') value = value===''?null:Number(value);
    else if(cast==='bool-yn') value = value===''?null:value==='YES';
    else if(value==='') value = null;
    patch = {[key]:value};
  }
  const {error} = await supabase.from(table).update(patch).eq('id',id);
  if(error){alert('Could not save: '+error.message);return;}
  const row = state[stateKey]?.find(r=>r.id===id);
  if(row) Object.assign(row, patch);
  if(td){td.classList.remove('cell-saved');void td.offsetWidth;td.classList.add('cell-saved');}
}

async function genericAddRow(table,stateKey,defaults){
  const {data,error} = await supabase.from(table).insert(defaults).select().single();
  if(error){alert('Could not add row: '+error.message);return;}
  state[stateKey].unshift(data); render();
}
async function genericDeleteRow(table,stateKey,id){
  if(!confirm('Delete this row? This cannot be undone.')) return;
  const {error} = await supabase.from(table).delete().eq('id',id);
  if(error){alert('Could not delete: '+error.message);return;}
  state[stateKey] = state[stateKey].filter(r=>r.id!==id); render();
}
async function genericAddField(table,stateKey){
  const name = prompt('New column name (e.g. "Insurance Provider"):');
  if(!name) return;
  const key = name.trim(); if(!key) return;
  for(const row of state[stateKey]){
    if(!(key in (row.extra||{}))){
      const extra = {...(row.extra||{}), [key]:''};
      const {error} = await supabase.from(table).update({extra}).eq('id',row.id);
      if(!error) row.extra = extra;
    }
  }
  render();
}
async function genericDeleteField(table,stateKey,key){
  if(!confirm(`Remove the "${key}" column for every row? This cannot be undone.`)) return;
  for(const row of state[stateKey]){
    if(row.extra && key in row.extra){
      const extra = {...row.extra}; delete extra[key];
      const {error} = await supabase.from(table).update({extra}).eq('id',row.id);
      if(!error) row.extra = extra;
    }
  }
  render();
}

function popOutField(el){
  if(el.tagName==='SELECT') return; // selects open their own dropdown, no need to pop
  const rect = el.getBoundingClientRect();
  el.classList.add('popped-field');
  el.style.left = rect.left+'px'; el.style.top = rect.top+'px'; el.style.width = Math.max(rect.width,220)+'px';
}
function unpopField(el){
  el.classList.remove('popped-field');
  el.style.left=''; el.style.top=''; el.style.width='';
}

function wireGenericTable(){
  document.querySelectorAll('[data-etable]').forEach(el=>{
    el.onchange=()=>genericFieldChange(el);
    if(el.tagName==='INPUT' || el.tagName==='SELECT'){
      el.addEventListener('focus',()=>popOutField(el));
      el.addEventListener('blur',()=>unpopField(el));
    }
  });
  document.querySelectorAll('[data-edit-toggle]').forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.editToggle; editState[k]=!editState[k]; render();
  });
  document.querySelectorAll('[data-add-row]').forEach(btn=>btn.onclick=()=>{
    const [table,stateKey] = btn.dataset.addRow.split('|');
    const defaults = JSON.parse(btn.dataset.addDefaults||'{}');
    genericAddRow(table,stateKey,defaults);
  });
  document.querySelectorAll('[data-add-field]').forEach(btn=>btn.onclick=()=>{
    const [table,stateKey] = btn.dataset.addField.split('|');
    genericAddField(table,stateKey);
  });
  document.querySelectorAll('[data-del-field]').forEach(btn=>btn.onclick=()=>{
    const [table,stateKey,key] = btn.dataset.delField.split('|');
    genericDeleteField(table,stateKey,key);
  });
  document.querySelectorAll('[data-del-row]').forEach(btn=>btn.onclick=()=>{
    const [table,stateKey,id] = btn.dataset.delRow.split('|');
    genericDeleteRow(table,stateKey,id);
  });
}

function dashboard(){
  const today = new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney'}).format(new Date());
  const todays = state.bookings.filter(b=>b.booking_date===today);
  const openInc = state.incidents.filter(x=>x.status!=='Closed').length;
  const todayChecks=state.checks.filter(x=>x.check_date===today);
  const daysUntil = d => d ? Math.round((new Date(d)-new Date())/86400000) : null;
  const expiringVehicles = state.vehicles
    .map(v=>{
      const rd=daysUntil(v.rego_expiry), hd=daysUntil(v.hvis_expiry);
      const soonest = [['Registration',v.rego_expiry,rd],['HVIS',v.hvis_expiry,hd]].filter(x=>x[2]!=null && x[2]<=30 && x[2]>=0).sort((a,b)=>a[2]-b[2])[0];
      return soonest ? {rego:v.rego, label:soonest[0], date:soonest[1], days:soonest[2]} : null;
    })
    .filter(Boolean).sort((a,b)=>a.days-b.days).slice(0,5);
  const astpComplete = state.astp.filter(a=>[a.driver_application_url,a.medical_fitness_url,a.wwc_url,a.drivers_licence_url].every(Boolean)).length;
  const showN = state.bookingsShowAll ? state.bookings.length : 3;
  const recentRows = state.bookings.slice(0,showN);
  const remaining = state.bookings.length - recentRows.length;

  const animating = (Date.now()-(state.refreshedAt||0)) < 5000;
  const auto = animating ? 'auto-play' : '';

  return `<div class="cards">
    <div class="card">${cardIcon('phone',auto)}<div class="metric-label">Today's bookings</div><div class="metric-value">${todays.length}</div><div class="metric-sub">Live from Supabase</div></div>
    <div class="card c-blue">${cardIcon('keyfob',auto)}<div class="metric-label">Fleet vehicles</div><div class="metric-value">${state.vehicles.length}</div><div class="metric-sub">${expiringVehicles.length} expiry alert${expiringVehicles.length===1?'':'s'} within 30 days</div></div>
    <div class="card">${cardIcon('dblcheck',auto)}<div class="metric-label">Today's checks</div><div class="metric-value">${todayChecks.length}</div><div class="metric-sub">Pre-start + post-shift</div></div>
    <div class="card c-red">${cardIcon('bell',auto)}<div class="metric-label">Open incidents</div><div class="metric-value">${openInc}</div><div class="metric-sub">Open / In Review</div></div>
  </div>
  <div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Recent bookings</h3></div>
      ${recentRows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Booking</th><th>Passenger</th><th>Date</th><th>Driver</th><th>Status</th></tr></thead><tbody>${recentRows.map(b=>`<tr class="${rowStatusClass(b.status)}"><td><strong>${esc(b.booking_code)}</strong></td><td>${esc(b.passenger_name||'—')}</td><td>${fmtDate(b.booking_date)}</td><td>${esc(personName(b.driver_id))}</td><td>${badge(b.status)}</td></tr>`).join('')}${remaining>0?`<tr class="show-more-row"><td colspan="5"><button class="link-btn" id="showMoreBookings">Show ${remaining} more →</button></td></tr>`:(state.bookingsShowAll && state.bookings.length>3?`<tr class="show-more-row"><td colspan="5"><button class="link-btn" id="showLessBookings">Show less</button></td></tr>`:'')}</tbody></table></div>` : '<div class="empty">No bookings yet.</div>'}
    </div>
    <div class="panel"><div class="panel-head"><h3>Fleet &amp; Compliance Snapshot</h3></div><div class="panel-body">
      ${expiringVehicles.length ? expiringVehicles.map(v=>`<div class="connection"><strong>${esc(v.rego)}</strong><span class="${v.days<=7?'warn':''}" style="${v.days<=7?'':'color:var(--muted)'}">${esc(v.label)} in ${v.days}d (${fmtDate(v.date)})</span></div>`).join('') : '<div class="connection"><strong>No expiries due soon</strong><span class="ok">All clear</span></div>'}
      <div class="connection"><strong>ASTP document completeness</strong><span class="${astpComplete===state.astp.length?'ok':'warn'}">${astpComplete} / ${state.astp.length} complete</span></div>
      <div class="connection"><strong>Stock items tracked</strong><span>${state.stock.length}</span></div>
    </div></div>
  </div>`;
}

/* ===================== Generic simple editable page builder (for Checks/Transfers/Incidents/Stock/Staff/ASTP) ===================== */

function editablePage({pageKey,title,table,stateKey,cols,addDefaults,rowAttrs}){
  const rows = state[stateKey];
  const editing = !!editState[pageKey];
  const extraKeys = extraKeysOf(rows);
  const allCols = [...cols, ...extraKeys.map(k=>({key:'__extra_'+k,label:k,extra:k}))];
  return `<div class="panel ${editing?'editing-mode':''}">
    <div class="panel-head"><h3>${title}</h3><div class="col-actions">
      ${editing?`<button class="col-add-btn" data-add-field="${table}|${stateKey}">+ Field</button>`:''}
      ${editing&&addDefaults!==undefined?`<button class="btn small" data-add-row="${table}|${stateKey}" data-add-defaults='${JSON.stringify(addDefaults)}'>+ Row</button>`:''}
      ${editToggle(pageKey)}
    </div></div>
    ${!rows.length?'<div class="empty">No records yet.</div>':`<div class="table-wrap"><table class="table"><thead><tr>${allCols.map(c=>{
      if(c.extra && editing) return `<th class="col-removable">${esc(c.label)}<button class="col-del-x" data-del-field="${table}|${stateKey}|${esc(c.extra)}">×</button></th>`;
      return `<th>${esc(c.label)}</th>`;
    }).join('')}${editing?'<th></th>':''}</tr></thead><tbody>
    ${rows.map(r=>`<tr ${rowAttrs?rowAttrs(r,editing):''} class="${(rowAttrs&&!editing?'clickable-check ':'')+c_rowClass(r)}">${allCols.map(c=>{
      if(c.extra) return `<td>${eExtra(table,stateKey,r.id,c.extra,(r.extra||{})[c.extra],{disabled:!editing})}</td>`;
      return `<td>${c.render(r,editing)}</td>`;
    }).join('')}${editing?`<td><button class="btn small danger" data-del-row="${table}|${stateKey}|${r.id}">Del</button></td>`:''}</tr>`).join('')}
    </tbody></table></div>`}
  </div>`;
}

function fieldLabel(key){

function isImageUrl(s){ return typeof s==='string' && (s.startsWith('data:image') || /\.(png|jpe?g|gif|webp)(\?|$)/i.test(s)); }
function isFileUrl(s){ return typeof s==='string' && /^https?:\/\//i.test(s); }
function formatDateObj(v){
  if(v && typeof v==='object' && (v.day||v.month||v.year)){
    const d=v.day?String(v.day).padStart(2,'0'):'', m=v.month?String(v.month).padStart(2,'0'):'', y=v.year||'';
    return [d,m,y].filter(Boolean).join('/');
  }
  return null;
}
function renderPayloadValue(key,v){
  if(v==null || v==='') return '<span class="muted">—</span>';
  const dateStr = formatDateObj(v);
  if(dateStr) return esc(dateStr);
  if(isImageUrl(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener"><img src="${esc(v)}" alt="${esc(fieldLabel(key))}" class="payload-thumb"></a>`;
  if(Array.isArray(v)){
    const imgs = v.filter(isImageUrl);
    if(imgs.length) return imgs.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="${esc(fieldLabel(key))}" class="payload-thumb"></a>`).join(' ');
    return esc(v.filter(Boolean).join(', ')) || '<span class="muted">—</span>';
  }
  if(typeof v==='object'){
    const vals = Object.entries(v).filter(([k])=>k!=='other').map(([,x])=>x);
    const other = v.other;
    const flat = [...vals, other].filter(x=>x!=null && x!=='');
    if(flat.some(isImageUrl)) return flat.filter(isImageUrl).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="${esc(fieldLabel(key))}" class="payload-thumb"></a>`).join(' ');
    return esc(flat.map(String).join(', ')) || '<span class="muted">—</span>';
  }
  if(isImageUrl(v)) return `<img src="${esc(v)}" class="payload-thumb">`;
  if(isFileUrl(v)) return fileLinkChip(v);
  return esc(String(v));
}
function fileExtLabel(url){
  const m = String(url).match(/\.([a-z0-9]{2,5})(?:\?|$)/i);
  return m ? m[1].toUpperCase() : 'FILE';
}
function fileLinkChip(url){
  if(isImageUrl(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" class="payload-thumb payload-thumb-sm" onerror="this.closest('a').outerHTML='<span class=&quot;file-chip file-chip-broken&quot;>Image unavailable (login-protected)</span>'"></a>`;
  if(/\.pdf(\?|$)/i.test(url)) return pdfPreviewHtml(url);
  return `<a class="file-chip" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-chip-ic">${fileExtLabel(url)}</span>Open file ↗</a>`;
}

/* Safe PDF thumbnail: fetches bytes via JS fetch() and renders page 1 to a canvas with pdf.js.
   Never navigates the browser to the raw URL, so it cannot trigger a forced download
   the way <embed>/<iframe> did. Falls back to a plain "Open file" chip if the fetch/CORS/render fails. */
const pdfThumbState = new Map(); // url -> 'pending' | 'done' | 'failed'
let pdfjsLibPromise = null;
function loadPdfJs(){
  if(!pdfjsLibPromise){
    pdfjsLibPromise = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs').then(lib=>{
      lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs';
      return lib;
    });
  }
  return pdfjsLibPromise;
}
function pdfPreviewHtml(url){
  const cid = 'pdfth_'+Math.random().toString(36).slice(2);
  return `<span class="pdf-thumb-wrap" data-pdf-url="${esc(url)}" data-pdf-cid="${cid}">
    <a class="file-chip pdf-chip-fallback" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-chip-ic">PDF</span>Open file ↗</a>
    <a href="${esc(url)}" target="_blank" rel="noopener" class="pdf-canvas-link" hidden><canvas id="${cid}" class="pdf-thumb-canvas"></canvas></a>
  </span>`;
}
async function processPdfThumbs(){
  const wraps = document.querySelectorAll('[data-pdf-url]');
  for(const wrap of wraps){
    const url = wrap.dataset.pdfUrl;
    const cached = pdfThumbState.get(url);
    if(cached==='failed'){ markFailed(wrap); continue; }
    if(cached==='done'){ paintCachedThumb(wrap,url); continue; }
    if(cached==='pending') continue;
    pdfThumbState.set(url,'pending');
    renderOnePdfThumb(wrap,url);
  }
}
function markFailed(wrap){
  // Fallback chip already shows "Open file" — nothing extra to change on failure.
}
const pdfThumbDataUrls = new Map();
function paintCachedThumb(wrap,url){
  const dataUrl = pdfThumbDataUrls.get(url); if(!dataUrl) return;
  const canvasLink = wrap.querySelector('.pdf-canvas-link'); const fallback = wrap.querySelector('.pdf-chip-fallback');
  const img = new Image(); img.className='pdf-thumb-canvas'; img.src=dataUrl;
  canvasLink.innerHTML=''; canvasLink.appendChild(img); canvasLink.hidden=false; fallback.hidden=true;
}
async function renderOnePdfThumb(wrap,url){
  try{
    const lib = await loadPdfJs();
    const res = await fetch(url); if(!res.ok) throw new Error('HTTP '+res.status);
    const buf = await res.arrayBuffer();
    const pdf = await lib.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale:1});
    const scale = 130/viewport.width;
    const scaledViewport = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(scaledViewport.width); canvas.height = Math.ceil(scaledViewport.height);
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext:ctx, viewport:scaledViewport}).promise;
    const dataUrl = canvas.toDataURL('image/png');
    pdfThumbDataUrls.set(url,dataUrl);
    pdfThumbState.set(url,'done');
    document.querySelectorAll(`[data-pdf-url="${CSS.escape(url)}"]`).forEach(w=>paintCachedThumb(w,url));
  }catch(e){
    console.warn('PDF preview failed for', url, '—', e.message||e);
    pdfThumbState.set(url,'failed');
    document.querySelectorAll(`[data-pdf-url="${CSS.escape(url)}"]`).forEach(w=>markFailed(w));
  }
}


/* File upload / replace — uploads to Supabase Storage 'documents' bucket, updates the row's URL column */
function eFileUpload(table,stateKey,id,key,currentUrl){
  const inputId = `upl_${table}_${id}_${key}`.replace(/[^a-zA-Z0-9_]/g,'');
  return `<div class="file-upload-cell">
    ${currentUrl?fileLinkChip(currentUrl):'<span class="muted">No file</span>'}
    <label class="btn small file-upload-btn" for="${inputId}">${currentUrl?'Replace':'Upload'}</label>
    <input type="file" id="${inputId}" class="file-upload-input" accept="application/pdf,image/*"
      data-eupload-table="${table}" data-eupload-state="${stateKey}" data-eupload-id="${id}" data-eupload-key="${key}" data-eupload-old="${esc(currentUrl||'')}">
  </div>`;
}
async function handleFileUpload(input){
  const file = input.files?.[0]; if(!file) return;
  const table = input.dataset.euploadTable, stateKey = input.dataset.euploadState, id = input.dataset.euploadId, key = input.dataset.euploadKey, old = input.dataset.euploadOld;
  const label = input.previousElementSibling;
  const origText = label.textContent; label.textContent='Uploading…';
  const path = `${table}/${id}/${key}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-]/g,'_')}`;
  const {error:upErr} = await supabase.storage.from('documents').upload(path,file,{upsert:true});
  if(upErr){alert('Upload failed: '+upErr.message); label.textContent=origText; return;}
  const {data:pub} = supabase.storage.from('documents').getPublicUrl(path);
  const newUrl = pub.publicUrl;
  const {error} = await supabase.from(table).update({[key]:newUrl}).eq('id',id);
  if(error){alert('Could not save new file URL: '+error.message); label.textContent=origText; return;}
  const row = state[stateKey]?.find(r=>r.id===id);
  if(row) row[key]=newUrl;
  if(old && old.includes('/documents/')){
    const oldPath = old.split('/documents/')[1];
    if(oldPath) supabase.storage.from('documents').remove([oldPath]).catch(()=>{});
  }
  render();
}




const NEGATIVE = /(missing|not working|fail|failed|fault|broken|damage|damaged|unsafe|defect|issue|problem|low|empty|expired|unavailable|not available|needs? repair)/i;
const EXPECTED_STOCK = ['gloves','surgical masks','sanitiser','cleaning supplies'];
function payloadText(v){
  if(v==null) return '';
  if(Array.isArray(v)) return v.map(payloadText).filter(Boolean).join(', ');
  if(typeof v==='object') return Object.values(v).map(payloadText).filter(Boolean).join(', ');
  return String(v).trim();
}
function checkIssues(row){
  const p=row.payload||{}; if(!Object.keys(p).length) return [];
  const issues=[]; const add=(key,label,msg)=>{if(msg&&!issues.some(x=>x.key===key&&x.message===msg))issues.push({key,label,message:msg});};
  const lower=k=>payloadText(p[k]).toLowerCase();
  if(lower('q54_fatigueManagement') && lower('q54_fatigueManagement')!=='yes') add('q54','Fatigue Management',payloadText(p.q54_fatigueManagement));
  if(lower('q55_emotionalWellbeing') && lower('q55_emotionalWellbeing')!=='yes') add('q55','Emotional Wellbeing',payloadText(p.q55_emotionalWellbeing));
  if(lower('q56_tripPlanning') && lower('q56_tripPlanning')!=='yes') add('q56','Trip Planning',payloadText(p.q56_tripPlanning));
  if(lower('q57_medicationAnd') && lower('q57_medicationAnd')!=='no') add('q57','Medication and Substances',payloadText(p.q57_medicationAnd));
  const passFields={q62_brakesAnd:'Brakes and Brake Lights',q63_tyreCondition63:'Tyres',q64_headlights64:'Headlights',q65_indicators65:'Indicators',q66_headlights66:'Windscreen',q67_headlights67:'Wipers',q68_headlights68:'Mirrors'};
  for(const [key,label] of Object.entries(passFields)){
    const v=p[key]; if(v==null) continue;
    const vals=Array.isArray(v)?v.map(x=>String(x).toLowerCase()):typeof v==='object'?Object.entries(v).filter(([k])=>k!=='other').map(([,x])=>String(x).toLowerCase()):[String(v).toLowerCase()];
    const other=typeof v==='object'&&!Array.isArray(v)?payloadText(v.other):'';
    if(vals.length && !vals.some(x=>['pass','yes','ok','okay'].includes(x))) add(key,label,payloadText(v));
    if(other) add(key,label,other);
  }
  const stock=p.q85_confirmItems85;
  if(stock){
    const selected=(Array.isArray(stock)?stock:Object.entries(stock).filter(([k])=>k!=='other').map(([,v])=>v)).map(x=>String(x).toLowerCase());
    const missing=EXPECTED_STOCK.filter(x=>!selected.includes(x));
    if(missing.length) add('q85','Stock Check',`Missing: ${missing.join(', ')}`);
  }
  return issues;
}
function complianceBadge(row){
  if(!Object.keys(row.payload||{}).length) return '<span class="muted">—</span>';
  const n=checkIssues(row).length;
  return n?`<span class="badge open">⚠ ${n} issue${n===1?'':'s'}</span>`:`<span class="badge completed">✓ Passed</span>`;
}



function genericDetailModal(table,id){
  const source={checks:state.checks,transfers:state.transfers,incidents:state.incidents,orientation:state.orientation,silMaintenance:state.silMaintenance,firstAid:state.firstAid,silVisitors:state.silVisitors}[table]||[];

  document.body.insertAdjacentHTML('beforeend',`<div class="compliance-modal-backdrop" id="genericDetailModal"><div class="compliance-modal"><div class="compliance-head"><div><h3>${titles[table]||'Submission'}</h3></div><button id="closeGenericDetail">×</button></div><div class="compliance-body">${issueSummary}<div class="answers-title">Complete submission</div>${rows}</div></div></div>`);

async function sendTestEmailCheck(){

    const res=await fetch('/.netlify/functions/expiry-check-test?key=29b545104d54fe607afe6f0b6a5f73cd');

    let json; try{json=JSON.parse(text);}catch{json=null;}
    if(!json){alert('Unexpected response: '+text.slice(0,300));return;}
    if(!json.ok){alert('Check failed: '+json.error);return;}
    alert(`Check ran: ${json.checked} vehicles checked, ${json.matchingAlerts} matched a threshold, ${json.alertsSent} email(s) sent.\n\n${(json.details||[]).join('\n')||'No vehicles are within an alert threshold right now.'}`);
  }catch(e){alert('Could not run check: '+e.message);}
}

/* ===================== Render / wiring ===================== */

function render(){
  let body='';
  if(state.current==='dashboard') body=dashboard();
  else if(state.current==='bookings') body=bookingsPage();
  else if(state.current==='checks') body=checksPage();
  else if(state.current==='transfers') body=transfersPage();
  else if(state.current==='fleet') body=fleetPage();
  else if(state.current==='stock') body=stockPage();
  else if(state.current==='staff') body=staffPage();
  else if(state.current==='astp') body=astpPage();
  else if(state.current==='incidents') body=incidentPage();
  else if(state.current==='sil') body=silPage();
  else body=integrations();
  app.innerHTML=shell(body);
  document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{state.current=x.dataset.page;render()});
  document.querySelector('#refreshBtn').onclick=refreshWithSplash;
  document.querySelector('#newBookingBtn')?.addEventListener('click',newBookingModal);
  document.querySelectorAll('[data-detail-table]').forEach(tr=>tr.onclick=()=>genericDetailModal(tr.dataset.detailTable,tr.dataset.detailId));
  document.querySelector('#notifSettingsForm')?.addEventListener('submit',saveNotificationSettings);
  document.querySelector('#showMoreBookings')?.addEventListener('click',()=>{state.bookingsShowAll=true;render();});
  document.querySelector('#showLessBookings')?.addEventListener('click',()=>{state.bookingsShowAll=false;render();});
  document.querySelectorAll('[data-eupload-table]').forEach(el=>el.onchange=()=>handleFileUpload(el));
  wireGenericTable();
  processPdfThumbs();
}

loadData();

  </script>
</body>
